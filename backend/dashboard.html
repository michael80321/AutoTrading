<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 交易合議所</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background:#0a0a0f; color:#e5e7eb; font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans TC",sans-serif; }
  .wrap { max-width:1280px; margin:0 auto; padding:24px; }
  h1 { font-size:28px; margin-bottom:4px; }
  .sub { color:#9ca3af; font-size:13px; margin-bottom:20px; }
  .tabs { display:flex; gap:8px; margin-bottom:20px; }
  .tab { padding:8px 18px; border-radius:8px; cursor:pointer; font-weight:600; background:#16161f; color:#9ca3af; border:1px solid #26262f; }
  .tab.active-crypto { background:#3a2f00; color:#facc15; border-color:#facc15; }
  .tab.active-stock { background:#0a2a3a; color:#38bdf8; border-color:#38bdf8; }
  .grid { display:grid; grid-template-columns:1fr 2fr; gap:20px; }
  @media(max-width:900px){ .grid{ grid-template-columns:1fr; } }
  .card { background:#16161f; border:1px solid #26262f; border-radius:12px; padding:16px; margin-bottom:16px; }
  .card h2 { font-size:15px; color:#d1d5db; margin-bottom:12px; }
  .row { display:flex; justify-content:space-between; padding:6px 0; font-size:14px; border-bottom:1px solid #1f1f29; }
  .row:last-child{ border:0; }
  .row .v { font-family:ui-monospace,monospace; }
  .pos { background:#1a1a24; border-radius:8px; padding:10px; margin-bottom:8px; font-size:13px; }
  .pos .hdr { display:flex; justify-content:space-between; margin-bottom:6px; }
  .badge { padding:2px 8px; border-radius:5px; font-size:11px; font-weight:600; }
  .long{ background:#0f3d2a; color:#34d399; } .short{ background:#3d1010; color:#f87171; }
  .chat { height:440px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; font-size:13px; }
  .msg .who { font-weight:600; }
  .msg .school { color:#6b7280; font-size:11px; margin-left:6px; }
  .msg .ts { color:#4b5563; font-size:11px; margin-left:8px; font-family:ui-monospace,monospace; }
  .msg .txt { color:#cbd5e1; margin-top:2px; line-height:1.45; }
  .msg.sig .txt { color:#fbbf24; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:7px 6px; border-bottom:1px solid #1f1f29; }
  th { color:#6b7280; font-weight:500; }
  td.name { font-weight:600; }
  .pnl-pos{ color:#34d399; } .pnl-neg{ color:#f87171; }
  .status { color:#6b7280; font-size:12px; text-align:right; margin-bottom:8px; }
  .dot{ display:inline-block; width:8px; height:8px; border-radius:50%; background:#34d399; margin-right:5px; }
  .crypto .accent{ color:#facc15; } .stock .accent{ color:#38bdf8; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🏛️ AI 交易合議所</h1>
  <div class="sub">雙池 · 36 席分析師 · 加密 (Binance) + 美股 (IBKR)</div>
  <div class="tabs">
    <div class="tab active-crypto" id="tab-crypto" onclick="switchPool('crypto')">加密池 · 18 席</div>
    <div class="tab" id="tab-stock" onclick="switchPool('stock')">美股池 · 18 席</div>
  </div>
  <div class="status"><span class="dot"></span>更新時間 <span id="updated">—</span></div>
  <div class="grid" id="root"></div>
</div>

<script>
let POOL = "crypto";
function switchPool(p){
  POOL = p;
  document.getElementById("tab-crypto").className = "tab" + (p==="crypto"?" active-crypto":"");
  document.getElementById("tab-stock").className = "tab" + (p==="stock"?" active-stock":"");
  refresh();
}
function fmt(n,d=2){ return (n==null||isNaN(n))?"—":Number(n).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d}); }
function pct(n){ return (n==null||isNaN(n))?"—":(n*100).toFixed(1)+"%"; }

async function refresh(){
  try{
    const r = await fetch(`/api/${POOL}/snapshot?t=${Date.now()}`);
    const d = await r.json();
    render(d);
    document.getElementById("updated").textContent = new Date().toLocaleTimeString("zh-TW");
  }catch(e){
    document.getElementById("root").innerHTML = `<div class="card">後端載入中或離線… (${e})</div>`;
  }
}

function render(d){
  const pf = (d.portfolio && (d.portfolio[POOL+"_pool"])) || {};
  const positions = pf.positions || [];
  const bots = d.bots || [];
  const chat = d.chat || [];
  const cls = POOL==="crypto" ? "crypto" : "stock";
  const cur = POOL==="crypto" ? "USDT" : "USD";

  const left = `
    <div class="${cls}">
      <div class="card">
        <h2>資金概覽</h2>
        <div class="row"><span>總資金</span><span class="v accent">$${fmt(pf.total)} ${cur}</span></div>
        <div class="row"><span>可用</span><span class="v">$${fmt(pf.available)}</span></div>
        <div class="row"><span>開放部位</span><span class="v">${pf.open_positions ?? 0}</span></div>
        <div class="row"><span>已實現 P&L</span><span class="v ${(pf.realized_pnl||0)>=0?'pnl-pos':'pnl-neg'}">$${fmt(pf.realized_pnl)}</span></div>
      </div>
      <div class="card">
        <h2>開放倉位 ${positions.length?`· ${positions.length} 筆`:""}</h2>
        ${positions.length ? positions.map(p=>`
          <div class="pos">
            <div class="hdr">
              <span><b class="accent">${p.symbol}</b> <span class="badge ${p.side==='LONG'?'long':'short'}">${p.side}</span></span>
              <span class="v">$${fmt(p.notional_usdt)}</span>
            </div>
            <div class="row"><span>進場</span><span class="v">${fmt(p.entry_price,4)}</span></div>
            <div class="row"><span>止損 SL</span><span class="v pnl-neg">${fmt(p.stop_loss,4)}</span></div>
            <div class="row"><span>TP1</span><span class="v pnl-pos">${fmt(p.tp1,4)}</span></div>
            <div class="row"><span>TP2</span><span class="v pnl-pos">${fmt(p.tp2,4)}</span></div>
            <div class="row"><span>進場時間</span><span class="v">${p.entry_time?new Date(p.entry_time).toLocaleString("zh-TW"):"—"}</span></div>
          </div>`).join("") : `<div style="color:#6b7280;font-size:13px;text-align:center;padding:14px">目前無開放倉位</div>`}
      </div>
    </div>`;

  const right = `
    <div class="${cls}">
      <div class="card">
        <h2>💬 即時聊天室 ${d.channel||""}</h2>
        <div class="chat" id="chat">
          ${chat.length ? chat.slice().reverse().map(m=>`
            <div class="msg ${m.confidence>0?'sig':''}">
              <span class="who accent">${m.from}</span><span class="school">${m.school||""} · ${m.symbol||""}</span><span class="ts">${m.timestamp?new Date(m.timestamp).toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit",second:"2-digit"}):""}</span>
              <div class="txt">${m.content||""}</div>
            </div>`).join("") : `<div style="color:#6b7280;padding:14px">分析師評估中…（首次最多等 60 秒）</div>`}
        </div>
      </div>
      <div class="card">
        <h2>📊 18 席分析師</h2>
        <table>
          <tr><th>分析師</th><th>學派</th><th>勝率</th><th>夏普</th><th>權重</th><th>狀態</th></tr>
          ${bots.map(b=>{ const mt=b.metrics||{}; return `
            <tr>
              <td class="name accent">${b.name}</td>
              <td>${b.school||""}</td>
              <td>${pct(mt.win_rate)}</td>
              <td>${fmt(mt.sharpe)}</td>
              <td>${fmt(b.weight)}</td>
              <td style="color:#34d399">${b.status||""}</td>
            </tr>`; }).join("")}
        </table>
      </div>
    </div>`;

  document.getElementById("root").innerHTML = left + right;
}

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
